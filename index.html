<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dragon Defence">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Dragon Defence Security Tools</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free security checks from Dragon Defence: email breach check, password breach check and QR code check.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: white brand bar with the Dragon Defence logo → charcoal hero with steel stripes and a scanner dial → tool cards, or a tool's results as panels */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --ink: #18222d;
  --muted: #5d6b78;
  --line: #d9dee4;
  --steer-cyan: #f29a2e;
  --steer-blue: #3d5a73;
  --hero: #1a2633;
  --hero-2: #2e4258;
  --hero-ink: #ffffff;
  --hero-muted: #bcc7d2;
  --accent: #3d5a73;
  --bad: #d23a26;
  --bad-bg: #fcebe8;
  --warn: #b26a00;
  --warn-bg: #fdf2de;
  --good: #1b8a50;
  --good-bg: #e3f5eb;
  --info: #3d5a73;
  --info-bg: #e8eef4;
  --track: #e5e9ee;
  --font-display: "Exo 2", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131a; --surface: #171f29; --ink: #e6eef5; --muted: #98a8b7; --line: #2a3644;
    --hero: #0f1720; --hero-2: #2a3d52; --hero-muted: #a9b6c3; --accent: #f29a2e;
    --bad: #ff8b77; --bad-bg: #3a1b18; --warn: #f3b75c; --warn-bg: #352710; --good: #6fd59c; --good-bg: #12301f;
    --info: #a9c3da; --info-bg: #1b2836; --track: #252f3b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131a; --surface: #171f29; --ink: #e6eef5; --muted: #98a8b7; --line: #2a3644;
  --hero: #0f1720; --hero-2: #2a3d52; --hero-muted: #a9b6c3; --accent: #f29a2e;
  --bad: #ff8b77; --bad-bg: #3a1b18; --warn: #f3b75c; --warn-bg: #352710; --good: #6fd59c; --good-bg: #12301f;
  --info: #a9c3da; --info-bg: #1b2836; --track: #252f3b; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1040px; margin: 0 auto; }
a { color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--steer-cyan); outline-offset: 2px; }

/* Brand bar (logo keeps its white ground in both themes) */
.brandbar { background: #ffffff; border-bottom: 4px solid var(--steer-cyan); }
.brandbar .inner { display: flex; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 10px; flex-wrap: wrap; }
.brandbar .logo { display: block; flex: 0 0 auto; }
.brandbar img { height: 54px; width: auto; display: block; }
nav.tools { display: flex; gap: 4px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
nav.tools::-webkit-scrollbar { display: none; }
nav.tools a { font-size: 13.5px; font-weight: 500; color: #3c4b58; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap; }
nav.tools a:hover { background: #eef2f6; color: #3d5a73; }
nav.tools a[aria-current="page"] { background: #3d5a73; color: #ffffff; }

/* Phone: compact header + bottom tab bar */
nav.tabbar { display: none; }
@media (max-width: 700px) {
  .brandbar .inner { padding-block: 8px; flex-wrap: nowrap; }
  .brandbar img { height: 40px; }
  .brandbar .apptitle { display: block; }
  nav.tools { display: none; }
  nav.tabbar {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
    box-shadow: 0 -6px 20px -14px rgba(20,30,40,.5);
  }
  nav.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; text-decoration: none; color: var(--muted); font-size: 10px; font-weight: 500; border-radius: 8px; min-width: 0; -webkit-tap-highlight-color: transparent; }
  nav.tabbar a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav.tabbar svg { width: 22px; height: 22px; }
  nav.tabbar a[aria-current="page"] { color: var(--accent); }
  nav.tabbar a[aria-current="page"] svg { stroke-width: 2.3; }
  body { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
  .hero .inner { padding-block: 24px 26px; gap: 18px; }
  .hero .dial-wrap { display: flex !important; }
  .hero .dial { max-width: 170px; }
  .lede { font-size: 15px; margin-bottom: 18px; }
  main .inner { padding-block: 22px 18px; gap: 16px; }
  .panel, .verdict { padding: 16px; }
  .tool-card { grid-template-columns: 56px minmax(0, 1fr); padding: 16px; gap: 14px; }
  .tool-card .art { width: 56px; height: 56px; border-radius: 12px; }
  .tool-card .art svg { width: 34px; height: 34px; }
}
.apptitle { display: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #3d5a73; border: 1px solid #cfd8e1; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }

/* Hero */
.hero { position: relative; overflow: hidden; color: var(--hero-ink); background: radial-gradient(120% 140% at 85% 20%, var(--hero-2) 0%, var(--hero) 60%); }
.ribbons { position: absolute; inset: 0; pointer-events: none; }
.ribbons i { position: absolute; right: -10%; height: 46px; width: 70%; border-radius: 0 0 0 120px; transform: skewY(-14deg); }
.ribbons i:nth-child(1) { top: 6%;  background: linear-gradient(90deg, transparent, rgba(120,140,160,.35)); }
.ribbons i:nth-child(2) { top: 26%; background: linear-gradient(90deg, transparent, rgba(80,100,122,.55)); }
.ribbons i:nth-child(3) { top: 46%; background: linear-gradient(90deg, transparent 10%, rgba(242,154,46,.28)); }
.ribbons i:nth-child(4) { top: 66%; background: linear-gradient(90deg, transparent 20%, rgba(160,176,192,.22)); }
.hero .inner { position: relative; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); gap: 32px; align-items: center; padding-block: 44px 52px; }
@media (max-width: 780px) { .hero .inner { grid-template-columns: 1fr; padding-block: 32px 36px; } .dial-wrap { display: none; } }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--steer-cyan); margin: 0 0 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 6vw, 54px); line-height: 1.03; margin: 0 0 14px; text-wrap: balance; letter-spacing: -0.015em; }
h1 .hl { color: var(--steer-cyan); }
.lede { color: var(--hero-muted); max-width: 54ch; margin: 0 0 22px; font-size: 16px; }
form.search { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.field { flex: 1 1 240px; min-width: 0; position: relative; display: flex; }
.field input { flex: 1; min-width: 0; font: inherit; font-family: var(--font-mono); font-size: 15px; padding: 14px 16px; border: 0; border-radius: 9px; background: #ffffff; color: #18222d; }
.field input::placeholder { color: #8a97a3; }
.field .reveal { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font: inherit; font-size: 12.5px; font-weight: 600; background: #eef3f7; color: #3d5a73; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.field.has-reveal input { padding-right: 70px; }
button.primary { font: inherit; font-weight: 600; padding: 14px 22px; border-radius: 9px; border: 0; background: var(--steer-cyan); color: #0f1720; cursor: pointer; flex: 0 0 auto; }
button.primary:hover { background: #4cc4ee; }
button.primary:disabled { opacity: .65; cursor: progress; }
.hero .fine { font-size: 12.5px; color: var(--hero-muted); margin: 12px 0 0; max-width: 62ch; }
.hero .fine a, .linkish { color: #ffffff; }
.linkish { background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; cursor: pointer; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-cta a { text-decoration: none; font-weight: 600; padding: 12px 18px; border-radius: 9px; }
.hero-cta a.solid { background: var(--steer-cyan); color: #0f1720; }
.hero-cta a.ghost { color: #ffffff; border: 1px solid rgba(255,255,255,.35); }

/* Dial */
.dial-wrap { display: flex; justify-content: center; }
.dial { width: 100%; max-width: 270px; aspect-ratio: 1; }
.dial .sweep { transform-origin: 140px 140px; animation: sweep 4s linear infinite; }
.dial.scanning .sweep { animation-duration: 1.1s; }
@keyframes sweep { to { transform: rotate(360deg); } }
.dial text { font-family: var(--font-display); fill: #ffffff; }
.dial .sub { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; fill: var(--hero-muted); }

/* Content */
main .inner { padding-block: 30px 24px; display: flex; flex-direction: column; gap: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.panel h3 { font-family: var(--font-display); font-size: 19px; margin: 0 0 4px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

.verdict { border-radius: 14px; padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
.verdict::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--state, var(--accent)); }
.verdict.bad { --state: var(--bad); } .verdict.good { --state: var(--good); } .verdict.err, .verdict.warn { --state: var(--warn); }
.verdict .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-left: 6px; }
.tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; color: var(--state); display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.verdict h2 { font-family: var(--font-display); font-size: clamp(22px, 3.4vw, 28px); line-height: 1.15; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.verdict p { margin: 0; max-width: 62ch; color: var(--muted); }
.example-flag { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; background: var(--ink); color: var(--bg); padding: 2px 8px; border-radius: 4px; }
@media (max-width: 620px) { .verdict { grid-template-columns: 1fr; } }

.gauge { width: 190px; max-width: 100%; }
.gauge text { font-family: var(--font-display); fill: var(--ink); }
.gauge .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; fill: var(--muted); }

.figures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.fig b { font-family: var(--font-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; color: var(--fc, var(--ink)); overflow-wrap: anywhere; }
.fig span { font-size: 12px; color: var(--muted); }
@media (max-width: 640px) { .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-mono); font-size: 10px; fill: var(--muted); }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; flex-direction: column; gap: 4px; }
.bar-row .k { font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; }
.bar-row .k b { font-weight: 500; }
.bar-row .k em { font-style: normal; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.bar-row .t { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar-row .t i { display: block; height: 100%; border-radius: inherit; background: var(--steer-cyan); width: 0; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.bar-row.hot .t i { background: var(--bad); }

.ledger { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.entry { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.avatar { width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: #ffffff; }
.entry .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.entry .top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.entry .name { font-weight: 600; font-size: 16px; }
.entry .dom { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.entry .desc { font-size: 13.5px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.entry .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.entry .yr { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; color: var(--muted); }
@media (max-width: 520px) { .entry { grid-template-columns: 40px minmax(0, 1fr); align-items: center; } .avatar { width: 40px; height: 40px; font-size: 15px; grid-column: 1; grid-row: 1; } .entry .yr { grid-column: 2; grid-row: 1; justify-self: end; font-size: 15px; } .entry .body { grid-column: 1 / -1; grid-row: 2; } }
.pill { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-bg); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-bg); }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: var(--good-bg); }

/* Check list rows */
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.check { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
.check:first-child { border-top: 0; padding-top: 4px; }
.check .ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--sbg); color: var(--s); }
.check .ico svg { width: 14px; height: 14px; }
.check.pass { --s: var(--good); --sbg: var(--good-bg); }
.check.warn { --s: var(--warn); --sbg: var(--warn-bg); }
.check.fail { --s: var(--bad); --sbg: var(--bad-bg); }
.check.info { --s: var(--info); --sbg: var(--info-bg); }
.check .body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.check .name { font-weight: 600; }
.check .what { font-size: 13.5px; color: var(--muted); margin: 0; }
.check .rec { font-family: var(--font-mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; overflow-x: auto; white-space: pre; max-width: 100%; }
.check .state { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--s); padding-top: 4px; white-space: nowrap; }
@media (max-width: 520px) { .check { grid-template-columns: 30px minmax(0, 1fr) auto; } .check .ico { grid-column: 1; grid-row: 1; } .check .body { grid-column: 2; grid-row: 1; } .check .state { grid-column: 3; grid-row: 1; } .check .rec { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-all; } }

/* Steps + CTA */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 800; font-size: 15px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--steer-cyan); color: #0f1720; }
.steps li b { font-weight: 600; }
.cta { border-radius: 14px; padding: 22px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; color: #ffffff; background: linear-gradient(110deg, var(--steer-blue), #5a7690 60%, var(--steer-cyan)); }
.cta p { margin: 0; max-width: 54ch; font-size: 15.5px; }
.cta a { font-weight: 600; color: #1a2633; background: #ffffff; padding: 11px 18px; border-radius: 9px; text-decoration: none; white-space: nowrap; }
.loading { display: flex; gap: 12px; align-items: center; color: var(--muted); padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.spinner { width: 18px; height: 18px; border: 2.5px solid var(--steer-cyan); border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.links a { font-size: 13.5px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--bg); padding: 9px 12px; border-radius: 9px; }

/* Dashboard */
.tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 720px) { .tool-grid { grid-template-columns: 1fr; } }
.tool-card { position: relative; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-decoration: none; color: inherit; transition: border-color .2s, transform .2s, box-shadow .2s; overflow: hidden; }
.tool-card:hover { border-color: var(--steer-cyan); transform: translateY(-2px); box-shadow: 0 10px 28px -16px rgba(61,90,115,.45); }
.tool-card .art { width: 76px; height: 76px; border-radius: 14px; background: linear-gradient(140deg, var(--hero-2), var(--hero)); display: grid; place-items: center; }
.tool-card .art svg { width: 44px; height: 44px; }
.tool-card .copy { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tool-card .q { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.tool-card h3 { font-family: var(--font-display); font-size: 21px; margin: 0; line-height: 1.15; }
.tool-card p { margin: 0; font-size: 14px; color: var(--muted); }
.tool-card .go { margin-top: 6px; font-weight: 600; font-size: 14px; color: var(--accent); }
.tool-card .chk { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.why { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 720px) { .why { grid-template-columns: 1fr; } }
.why div { padding: 4px 0; }
.why b { display: block; font-family: var(--font-display); font-size: 34px; color: var(--accent); line-height: 1.05; font-variant-numeric: tabular-nums; }
.why span { font-size: 13.5px; color: var(--muted); }

/* Password specifics */
.meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 4px 0 10px; }
.meter i { height: 10px; border-radius: 4px; background: var(--track); transition: background .3s; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
.flow div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; position: relative; min-width: 0; }
.flow b { font-size: 13px; }
.flow code { font-family: var(--font-mono); font-size: 12px; color: var(--accent); overflow-wrap: anywhere; }
.flow span { font-size: 12px; color: var(--muted); }
@media (max-width: 720px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.fill-steps .copybtn { display: inline-block; margin: 0 2px; }
.iasme-fill textarea { font: inherit; font-family: var(--font-mono); font-size: 12.5px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; resize: vertical; }
.iasme-fill .btnp { align-self: flex-start; }
.goodnote { color: var(--good); }
.ce-sub { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); font-family: var(--font-mono); overflow-wrap: anywhere; }

/* QR check */
.qr-box { display: flex; flex-direction: column; gap: 10px; }
.qr-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.qr-actions .ghostbtn { cursor: pointer; }
form.search.qr-paste { padding: 6px; }
form.search.qr-paste .field input { padding: 11px 14px; font-size: 14px; }
form.search.qr-paste button.primary { padding: 11px 18px; background: rgba(255,255,255,.14); color: #ffffff; }
.qr-stage { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; max-width: 420px; max-height: 70vh; width: 100%; margin: 4px auto 14px; }
.qr-stage video { width: 100%; height: 100%; object-fit: cover; display: block; }
.qr-frame { position: absolute; inset: 18% 14%; border: 3px solid var(--steer-cyan); border-radius: 18px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
.qr-cam-wrap { display: flex; flex-direction: column; align-items: center; }
.qr-link { display: flex; flex-direction: column; gap: 12px; }
.qr-dom { font-size: 15px; }
.qr-dom b { font-family: var(--font-mono); font-size: 16px; overflow-wrap: anywhere; }
.qr-link code { font-family: var(--font-mono); font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; word-break: break-all; white-space: pre-wrap; }
.qr-link mark { background: color-mix(in srgb, var(--steer-cyan) 30%, transparent); color: var(--ink); border-radius: 3px; padding: 0 1px; font-weight: 600; }
.copybtn.danger { color: #ffffff; background: var(--bad); border-color: var(--bad); }

footer .inner { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-block: 18px 40px; display: flex; flex-direction: column; gap: 6px; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { .dial .sweep, .spinner { animation-duration: 6s; } .bar-row .t i, .tool-card { transition: none; } }

/* Dragon Defence */
.brandbar .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brandbar img.mark { height: 52px; }
.brandbar img.word { height: 34px; }
.home-hero-logo { display: flex; justify-content: center; }
.home-hero-logo img { width: 100%; max-width: 250px; height: auto; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
.tool-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tcard { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; text-decoration: none; color: var(--ink); border-top: 4px solid var(--steer-cyan); transition: transform .15s, box-shadow .15s; }
.tcard:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -18px rgba(20,30,40,.45); }
.tcard .art { width: 56px; height: 56px; border-radius: 12px; background: #1a2633; display: grid; place-items: center; }
.tcard .art svg { width: 34px; height: 34px; }
.tcard .q { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tcard b { font-family: var(--font-display); font-size: 20px; }
.tcard p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.tcard .go { font-weight: 600; color: var(--accent); }
.cta.nolink a { display: none; }
@media (max-width: 860px) { .tool-cards { grid-template-columns: 1fr; } }
@media (max-width: 700px) {
  nav.tabbar { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .brandbar img.mark { height: 40px; } .brandbar img.word { height: 26px; }
  .home-hero-logo img { max-width: 150px; }
}
@media (max-width: 380px) { .brandbar img.word { height: 21px; } }

<body>

<section class="hero gutter">

<main class="gutter"><div class="inner" id="out" aria-live="polite"></div></main>

<footer class="gutter"><div class="inner" id="foot"></div></footer>

<script>
(() => {
  const BRAND = {
    name: "Dragon Defence",
    // Put Dragon Defence's website or a mailto: link here to show a contact button under each result
    ctaLink: "",
    ctaLabel: "Talk to Dragon Defence"
  };
  const SVGNS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const heroEl = $("hero"), out = $("out"), foot = $("foot");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const sv = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const html = (s) => { const t = document.createElement("template"); t.innerHTML = s.trim(); return t.content; };
  const stripTags = (s) => { const d = document.createElement("div"); d.innerHTML = String(s || ""); return (d.textContent || "").replace(/\s+/g, " ").trim(); };
  const fmt = (n) => Number(n || 0).toLocaleString("en-GB");
  const compact = (n) => Intl.NumberFormat("en-GB", { notation: "compact", maximumFractionDigits: 1 }).format(Number(n || 0));
  const isYes = (v) => String(v).toLowerCase() === "yes";
  const raf2 = (fn) => requestAnimationFrame(() => requestAnimationFrame(fn));

  // ================= Shared components =================
  function makeDial() {
    const wrap = el("div", "dial-wrap"); wrap.setAttribute("aria-hidden", "true");
    const svg = sv("svg", { class: "dial", viewBox: "0 0 280 280" });
    const uid = "sw" + Math.random().toString(36).slice(2, 7);
    svg.innerHTML = `<defs><linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f29a2e" stop-opacity="0"/><stop offset="1" stop-color="#f29a2e" stop-opacity=".55"/></linearGradient></defs>
      <circle cx="140" cy="140" r="130" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.18)"/>
      <circle cx="140" cy="140" r="95" fill="none" stroke="rgba(255,255,255,.12)"/>
      <circle cx="140" cy="140" r="60" fill="none" stroke="rgba(255,255,255,.12)"/>
      <line x1="10" y1="140" x2="270" y2="140" stroke="rgba(255,255,255,.08)"/>
      <line x1="140" y1="10" x2="140" y2="270" stroke="rgba(255,255,255,.08)"/>
      <g class="sweep"><path d="M140 140 L270 140 A130 130 0 0 0 232 48 Z" fill="url(#${uid})"/></g>
      <g class="blips"></g>
      <circle cx="140" cy="140" r="46" fill="#1a2633" stroke="#f29a2e" stroke-width="2"/>
      <text class="num" x="140" y="149" text-anchor="middle" font-size="30" font-weight="700">–</text>
      <text class="sub" x="140" y="167" text-anchor="middle">READY</text>`;
    wrap.append(svg);
    const set = ({ value = "–", sub = "", colour = "#ffffff", blips = 0, scanning = false } = {}) => {
      svg.classList.toggle("scanning", scanning);
      const num = svg.querySelector(".num"); num.textContent = scanning ? "…" : String(value); num.setAttribute("fill", colour);
      const len = num.textContent.length; num.setAttribute("font-size", len <= 3 ? 30 : len <= 4 ? 24 : 18); num.setAttribute("y", len <= 3 ? 149 : 147);
      svg.querySelector(".sub").textContent = scanning ? "SCANNING" : sub;
      const g = svg.querySelector(".blips"); g.replaceChildren();
      if (!scanning) for (let i = 0; i < Math.min(blips, 14); i++) {
        const a = (i * 137.5) * Math.PI / 180, r = 62 + (i * 23) % 62;
        g.append(sv("circle", { cx: 140 + r * Math.cos(a), cy: 140 + r * Math.sin(a), r: 4.5, fill: "#ff8b77", stroke: "#0f1720", "stroke-width": 1.5 }));
      }
    };
    return { node: wrap, set };
  }

  // mode "risk": high = bad. mode "protect": high = good.
  function gauge(score, mode, caption) {
    const s = Math.max(0, Math.min(100, Math.round(score)));
    let colour, label;
    if (mode === "risk") { [label, colour] = s === 0 ? ["CLEAR", "var(--good)"] : s < 35 ? ["LOW", "var(--good)"] : s < 60 ? ["MEDIUM", "var(--warn)"] : s < 80 ? ["HIGH", "var(--bad)"] : ["CRITICAL", "var(--bad)"]; }
    else { [label, colour] = s >= 85 ? ["STRONG", "var(--good)"] : s >= 65 ? ["GOOD", "var(--good)"] : s >= 45 ? ["FAIR", "var(--warn)"] : ["WEAK", "var(--bad)"]; }
    const svg = sv("svg", { viewBox: "0 0 200 124", class: "gauge", role: "img", "aria-label": `${caption} ${s} out of 100, ${label.toLowerCase()}` });
    const r = 80, cx = 100, cy = 100, len = Math.PI * r, arc = `M${cx - r} ${cy} A${r} ${r} 0 0 1 ${cx + r} ${cy}`;
    svg.append(sv("path", { d: arc, fill: "none", stroke: "var(--track)", "stroke-width": 16, "stroke-linecap": "round" }));
    const fg = sv("path", { d: arc, fill: "none", stroke: colour, "stroke-width": 16, "stroke-linecap": "round", "stroke-dasharray": len, "stroke-dashoffset": len });
    fg.style.transition = "stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"; svg.append(fg);
    const t = sv("text", { x: cx, y: 92, "text-anchor": "middle", "font-size": 38, "font-weight": 800 }); t.textContent = s; svg.append(t);
    const l = sv("text", { x: cx, y: 116, "text-anchor": "middle", class: "lbl" }); l.textContent = caption.toUpperCase() + " · " + label; svg.append(l);
    raf2(() => fg.setAttribute("stroke-dashoffset", String(len * (1 - Math.max(s, 2) / 100))));
    return svg;
  }

  let PREFILL = null;   // { route, value } handed from the full report to a tool
  let current = null;
  const TITLES = { home: "Security Tools", breach: "Email breach check", password: "Password check", qr: "QR code check" };
  function takePrefill(route) { if (PREFILL && PREFILL.route === route) { const v = PREFILL.value; PREFILL = null; return v; } return null; }

  // Plain-text summary of whatever result is on screen, for the share sheet
  function resultText() {
    const L = [`${BRAND.name} · ${TITLES[current] || "Security Tools"}`];
    const v = out.querySelector(".verdict"); if (!v) return L.join("\n");
    if (v.querySelector(".example-flag")) L.push("(Example data)");
    L.push("", v.querySelector("h2").textContent);
    const p = v.querySelector(".txt > p"); if (p) L.push(p.textContent);
    const g = v.querySelector("svg[aria-label]"); if (g) L.push(g.getAttribute("aria-label"));
    const secs = [...out.querySelectorAll(".sec-row, .share-line")]; if (secs.length) { L.push(""); secs.forEach(r => L.push("• " + r.dataset.text)); }
    const figs = [...out.querySelectorAll(".fig")]; if (figs.length) { L.push(""); figs.forEach(f => L.push(`• ${f.querySelector("b").textContent} ${f.querySelector("span").textContent}`)); }
    const cds = [...out.querySelectorAll(".cd")]; if (cds.length) { L.push(""); cds.forEach(c => L.push(`• ${c.querySelector(".cap").textContent}: ${c.querySelector("b").textContent}`)); }
    const checks = [...out.querySelectorAll(".check")]; if (checks.length) { L.push(""); checks.forEach(c => L.push(`[${c.querySelector(".state").textContent}] ${c.querySelector(".name").textContent}`)); }
    const ents = [...out.querySelectorAll(".entry")]; if (ents.length) { L.push("", "Breaches:"); ents.forEach(e => L.push(`• ${e.querySelector(".name").textContent} (${e.querySelector(".yr").textContent})`)); }
    L.push("", "Checked with Dragon Defence Security Tools");
    if (/^https:/.test(location.href) && !/claude/i.test(location.host)) L.push(location.href.split("#")[0] + "#" + current);
    if (/^https?:/.test(BRAND.ctaLink)) L.push("Dragon Defence · " + BRAND.ctaLink.replace(/^https?:\/\//, ""));
    return L.join("\n");
  }
  const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>';
  function shareButton() {
    const b = el("button", "sharebtn"); b.type = "button"; b.innerHTML = SHARE_ICON; b.append(document.createTextNode("Share result"));
    const label = (t) => { b.lastChild.textContent = t; };
    b.addEventListener("click", async () => {
      const text = resultText(), title = BRAND.name + " · " + (TITLES[current] || "Security Tools");
      if (navigator.share) { try { await navigator.share({ title, text }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
      try { await navigator.clipboard.writeText(text); label("Copied to clipboard"); }
      catch { label("Couldn't share here"); }
      setTimeout(() => label("Share result"), 2200);
    });
    return b;
  }
  function verdict(state, tagText, title, body, isExample, side) {
    const v = el("div", "verdict " + state); const t = el("div", "txt");
    const tag = el("div", "tag", tagText); if (isExample) tag.append(el("span", "example-flag", "Example data"));
    t.append(tag, el("h2", null, title)); if (body) t.append(el("p", null, body));
    if (state !== "err") t.append(shareButton());
    v.append(t); if (side) v.append(side); return v;
  }
  function figures(items) {
    const figs = el("div", "figures");
    items.forEach(([b, s, c]) => { const f = el("div", "fig"); const bb = el("b", null, b); if (c) bb.style.setProperty("--fc", c); f.append(bb, el("span", null, s)); figs.append(f); });
    return figs;
  }
  function panel(title, hint) { const p = el("div", "panel"); p.append(el("h3", null, title)); if (hint) p.append(el("p", "hint", hint)); return p; }
  function stepsPanel(title, hint, steps) {
    const p = panel(title, hint); const ol = el("ol", "steps");
    steps.forEach(([h, s]) => { const li = el("li"); const sp = el("span"); sp.append(el("b", null, h + " "), document.createTextNode(s)); li.append(sp); ol.append(li); });
    p.append(ol); return p;
  }
  function cta(text) {
    const c = el("div", "cta" + (BRAND.ctaLink ? "" : " nolink")); c.append(el("p", null, text));
    const a = el("a", null, BRAND.ctaLabel + " →"); a.href = BRAND.ctaLink; a.target = "_blank"; a.rel = "noopener"; c.append(a); return c;
  }
  const ICONS = {
    pass: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
    warn: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 3v6"/><circle cx="8" cy="12.6" r=".6" fill="currentColor"/></svg>',
    fail: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
    info: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 7v5"/><circle cx="8" cy="4" r=".6" fill="currentColor"/></svg>'
  };
  const STATE_LABEL = { pass: "Pass", warn: "Improve", fail: "Fail", info: "Optional" };
  function checkList(items) {
    const ul = el("ul", "checks");
    items.forEach(c => {
      const li = el("li", "check " + c.status);
      const ico = el("span", "ico"); ico.innerHTML = ICONS[c.status]; ico.setAttribute("aria-hidden", "true");
      const body = el("div", "body"); body.append(el("span", "name", c.name), el("p", "what", c.what));
      if (c.record) body.append(el("div", "rec", c.record));
      li.append(ico, body, el("span", "state", c.label || STATE_LABEL[c.status])); ul.append(li);
    });
    return ul;
  }
  function loading(text) { out.replaceChildren(); const d = el("div", "loading"); d.append(el("span", "spinner"), el("span", null, text)); out.append(d); }
  function errorBox(title, msg) { out.replaceChildren(verdict("err", "Couldn't check", title, msg)); }
  const NET_ERR = "Check your connection and try again. If you're viewing this inside a preview that blocks outside requests, open the toolkit from its hosted address instead.";

  // Hero builder
  function buildHero({ eyebrow, title, lede, form, fine, ctas }) {
    heroEl.replaceChildren();
    const left = el("div");
    left.append(el("p", "eyebrow", eyebrow));
    const h = el("h1"); h.innerHTML = title; left.append(h);
    left.append(el("p", "lede", lede));
    if (form) left.append(form);
    if (ctas) left.append(ctas);
    if (fine) { const f = el("p", "fine"); f.append(...fine); left.append(f); }
    const dial = makeDial();
    heroEl.append(left, dial.node);
    return dial;
  }
  function searchForm({ id, label, type = "text", placeholder, button, reveal, autocomplete = "off", inputmode }) {
    const f = el("form", "search"); f.noValidate = true;
    const lab = el("label", "sr", label); lab.htmlFor = id;
    const field = el("div", "field" + (reveal ? " has-reveal" : ""));
    const inp = el("input"); inp.id = id; inp.type = type; inp.placeholder = placeholder; inp.autocomplete = autocomplete; inp.spellcheck = false; inp.setAttribute("autocapitalize", "off");
    if (inputmode) inp.inputMode = inputmode;
    field.append(inp);
    if (reveal) {
      const b = el("button", "reveal", "Show"); b.type = "button";
      b.addEventListener("click", () => { const show = inp.type === "password"; inp.type = show ? "text" : "password"; b.textContent = show ? "Hide" : "Show"; });
      field.append(b);
    }
    const btn = el("button", "primary", button); btn.type = "submit";
    f.append(lab, field, btn);
    return { form: f, input: inp, button: btn };
  }
  function exLink(text, onClick) { const b = el("button", "linkish", text); b.type = "button"; b.addEventListener("click", onClick); return b; }
  function extA(text, href) { const a = el("a", null, text); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; }

  // DNS over HTTPS (Google, then Cloudflare)
  async function dns(name, type) {
    const tries = [
      () => fetch(`https://dns.google/resolve?name=${encodeURIComponent(name)}&type=${type}`),
      () => fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(name)}&type=${type}`, { headers: { accept: "application/dns-json" } })
    ];
    let lastErr;
    for (const t of tries) {
      try { const r = await t(); if (!r.ok) throw new Error("dns " + r.status); return await r.json(); } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }
  const TYPE_NUM = { A: 1, CNAME: 5, MX: 15, TXT: 16, AAAA: 28, CAA: 257 };
  const answers = (res, type) => (res && Array.isArray(res.Answer) ? res.Answer : []).filter(a => a.type === TYPE_NUM[type]).map(a => type === "TXT" ? String(a.data).replace(/^"|"$/g, "").replace(/"\s*"/g, "") : String(a.data));
  const cleanHost = (s) => String(s || "").trim().toLowerCase().replace(/^[a-z]+:\/\//, "").replace(/^.*@/, "").split(/[\/?#:]/)[0].replace(/\.$/, "");
  const validHost = (h) => /^(?=.{3,253}$)([a-z0-9-]{1,63}\.)+[a-z]{2,63}$/.test(h);

  // ================= Tool: Breach check =================
  const Breach = (() => {
    const API = "https://api.xposedornot.com/v1/breach-analytics?email=";
    const SENSITIVE = /password|credit|card|bank|security question|social security|passport|dates? of birth|phone|physical address|financial|ssn|pin/i;
    const PW_RISK = { plaintext: ["Plain-text passwords", "bad", 3], easytocrack: ["Weak password hashes", "bad", 2.5], hardtocrack: ["Strong password hashes", "warn", 1], unknown: ["Password storage unknown", "", 1] };

          tel: () => { const prem = /^(\+?44)?0?(9|87|84|70)/.test(c.number.replace(/\s/g, "")); checks = [{ status: prem ? "fail" : "info", name: prem ? "Premium-rate number" : "Calls a phone number", what: prem ? "Calls to 09, 087, 084 and 070 numbers can be very expensive, and 070 numbers are often used by scammers." : "Check the number matches the organisation's official contact details.", label: prem ? undefined : "Note" }]; title = `Calls ${c.number}`; body = "Your phone will offer to call this number."; },
          email: () => { checks = [{ status: "info", name: "Writes an email", what: `Opens a new email to ${c.to}${c.subject ? " with the subject “" + c.subject + "”" : ""}. Nothing is sent until you press Send.`, label: "Note" }]; title = `Emails ${c.to}`; body = "Check the address belongs to who you expect."; },
          vcard: () => { checks = [{ status: "info", name: "Adds a contact", what: "Saving it is harmless, but scammers sometimes use contact cards to make their number look official.", label: "Note" }]; title = `Contact card${c.name ? " for " + c.name : ""}`; body = "Saves a name and contact details to your phone."; },
          event: () => { checks = [{ status: "info", name: "Adds a calendar event", what: "Check any links inside the event before opening them.", label: "Note" }]; title = `Calendar event${c.title ? ": " + c.title : ""}`; body = "Adds an event to your calendar."; },
          geo: () => { checks = [{ status: "pass", name: "Opens a map location", what: "Shows a place in your maps app." }]; title = "Shows a location on a map"; body = c.text; },
          script: () => { checks = [{ status: "fail", name: "Runs code", what: "This QR code tries to run code or open a file directly. There's no legitimate reason for that." }]; title = "This QR code tries to run code"; body = "Don't open it."; },
          app: () => { checks = [{ status: "warn", name: `Opens an app (${c.scheme}:)`, what: "It hands information to an app on your phone. Only continue if you know which app and why." }]; title = `Opens an app using “${c.scheme}:”`; body = "Not a web link."; },
          text: () => { const hasLink = /https?:\/\/|www\./i.test(c.text); checks = [{ status: hasLink ? "warn" : "pass", name: hasLink ? "Text containing a link" : "Plain text only", what: hasLink ? "The text includes a web address. Copy it into the box above to check it." : "Just text. It can't open anything on its own." }]; title = "Contains text, not a link"; body = c.text.length > 160 ? c.text.slice(0, 157) + "…" : c.text; }

      const order = { fail: 0, warn: 1, info: 2, pass: 3 };

      pc.append(checkList(checks.length ? checks.slice().sort((a, b) => order[a.status] - order[b.status]) : [{ status: "pass", name: "No warning signs", what: "Nothing unusual in the link." }]));
      out.append(pc);
      out.append(stepsPanel("Staying safe with QR codes", "Share these with your team.", [
        ["Check for stickers", "on parking meters, posters and menus. Scammers stick their own codes over the real ones."],

        ["Type it yourself", "for payments and logins, go to the official website or app rather than following a code."],
        ["If you entered details", "change that password straight away and tell your IT team."]

      out.append(cta("Worried about QR phishing reaching your staff? Dragon Defence can run awareness training and tighten your email filtering."));
    }

    // ---------- Scanning ----------
    function loadLib() {
      if (window.jsQR) return Promise.resolve(window.jsQR);
      if (!libP) libP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = JSQR_URL; s.async = true; s.onload = () => window.jsQR ? res(window.jsQR) : rej(new Error("jsQR")); s.onerror = () => { libP = null; rej(new Error("load")); }; document.head.append(s); });
      return libP;
    }
    async function decodeCanvas(ctx, w, h) {
      if ("BarcodeDetector" in window) { try { const d = new window.BarcodeDetector({ formats: ["qr_code"] }); const r = await d.detect(ctx.canvas); if (r && r[0] && r[0].rawValue) return r[0].rawValue; } catch {} }
      const jsQR = await loadLib();
      const img = ctx.getImageData(0, 0, w, h);
      const r = jsQR(img.data, w, h, { inversionAttempts: "attemptBoth" });
      return r && r.data ? r.data : null;
    }
    function stopCam() { cancelAnimationFrame(raf); raf = 0; if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } const v = document.getElementById("qr-cam"); if (v) v.closest(".qr-cam-wrap").remove(); }
    async function startCam(btn) {
      if (stream) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { errorBox("The camera isn't available here", "Use Upload a photo instead, or take a screenshot of the QR code and upload that."); return; }
      try { await loadLib(); } catch { errorBox("The scanner couldn't load", "Check your connection, or paste the link into the box instead."); return; }
      try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false }); }
      catch (e) { stream = null; errorBox("The camera couldn't start", e && e.name === "NotAllowedError" ? "Camera access was refused. Allow it in Settings → Safari → Camera (or for this app), or use Upload a photo instead." : "Use Upload a photo instead, or take a screenshot of the QR code and upload that."); return; }
      out.replaceChildren();
      const wrap = el("div", "qr-cam-wrap panel");
      const v = el("video"); v.id = "qr-cam"; v.setAttribute("playsinline", ""); v.muted = true; v.srcObject = stream;
      const frame = el("div", "qr-frame"); frame.setAttribute("aria-hidden", "true");
      const stage = el("div", "qr-stage"); stage.append(v, frame);
      const stop = el("button", "copybtn", "Stop scanning"); stop.type = "button"; stop.addEventListener("click", stopCam);
      wrap.append(el("p", "hint", "Point the camera at the QR code. Nothing is opened."), stage, stop);
      out.append(wrap); wrap.scrollIntoView({ behavior: "smooth", block: "center" });
      dial.set({ scanning: true });
      try { await v.play(); } catch {}
      const cv = document.createElement("canvas"), ctx = cv.getContext("2d", { willReadFrequently: true });
      let last = 0;
      const tick = async (t) => {
        if (!stream) return;
        if (current !== "qr") { stopCam(); return; }
        if (t - last > 180 && v.readyState >= 2 && v.videoWidth) {
          last = t;
          const scale = Math.min(1, 720 / v.videoWidth); cv.width = Math.round(v.videoWidth * scale); cv.height = Math.round(v.videoHeight * scale);
          ctx.drawImage(v, 0, 0, cv.width, cv.height);
          const data = await decodeCanvas(ctx, cv.width, cv.height).catch(() => null);
          if (data && stream) { stopCam(); try { navigator.vibrate && navigator.vibrate(60); } catch {} render(data, false); return; }
        }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }
    async function fromFile(file) {
      if (!file) return;
      loading("Reading the QR code…"); dial.set({ scanning: true });
      try {
        const url = URL.createObjectURL(file);
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
        let found = null;
        for (const max of [1600, 1000, 2400, 600]) {
          const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
          const ctx = cv.getContext("2d", { willReadFrequently: true }); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);

        render(found, false);
      } catch (e) { dial.set(); errorBox("Couldn't read that picture", String(e && e.message) === "load" || String(e && e.message) === "jsQR" ? "The scanner couldn't load. Check your connection, or paste the link into the box instead." : "Try a different photo or a screenshot of the QR code."); }
    }
    const SAMPLE = "https://microsoft365.login-verify.co/secure/auth?ref=parking-fine&user=you%40company.co.uk";
    const SAMPLE_LIVE = [{ status: "fail", name: "Registered 4 days ago", what: "login-verify.co was registered 4 days ago. Most scam sites are only days or weeks old." }];
    function mount() {
      const wrap = el("div", "qr-actions");
      const camB = el("button", "primary", "Scan with camera"); camB.type = "button"; camB.addEventListener("click", () => startCam(camB));
      const fileIn = el("input"); fileIn.type = "file"; fileIn.accept = "image/*"; fileIn.id = "qr-file"; fileIn.className = "sr";
      fileIn.addEventListener("change", () => { const f = fileIn.files && fileIn.files[0]; fileIn.value = ""; stopCam(); fromFile(f); });
      const fileL = el("label", "ghostbtn", "Upload a photo"); fileL.htmlFor = "qr-file"; fileL.tabIndex = 0; fileL.setAttribute("role", "button");
      fileL.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileIn.click(); } });
      wrap.append(camB, fileL, fileIn);

      const box = el("div", "qr-box"); box.append(wrap, f.form);
      dial = buildHero({ eyebrow: "QR code check", title: 'Scan it here <span class="hl">before you tap it</span>.', lede: "Shows where a QR code really leads and flags the warning signs of QR phishing (“quishing”), without opening the link. Works with the camera, a photo or a screenshot.", form: box,

  // ================= Home =================

  // ================= Router =================
  const ROUTES = { home: Home, breach: Breach, password: Password, qr: QR };
